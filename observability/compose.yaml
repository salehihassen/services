name: observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loki:
    container_name: loki
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    command: ["-config.file=/etc/loki/config.yaml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - ./data/loki:/loki
    networks: [observability]
    logging: *default-logging
    mem_limit: 1g

  grafana:
    container_name: grafana
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: unless-stopped
    depends_on: [loki]
    ports:
      - "127.0.0.1:13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    networks: [observability]
    logging: *default-logging
    mem_limit: 512m

  alloy:
    container_name: alloy
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    depends_on: [loki]
    ports:
      - "127.0.0.1:12345:12345"
    environment:
      HOST_LABEL: ${HOST_LABEL:?Set HOST_LABEL in /opt/observability/.env}
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ./data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [observability]
    logging: *default-logging
    mem_limit: 512m

networks:
  observability:

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
