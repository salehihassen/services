name: Validate services stack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

      # The action above only scans commits in the current push. Rescan every
      # commit with the repository rules, which add bcrypt hash detection.
      - name: Scan full Git history with repository rules
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  validate:
    name: Compose and configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
        with:
          version: v5.5.1

      - name: Validate Compose projects
        run: bash scripts/validate-stack.sh compose

      - name: Build custom Caddy image
        run: bash scripts/validate-stack.sh caddy-build

      - name: Validate Caddyfile
        run: bash scripts/validate-stack.sh caddy

      - name: Check Alloy formatting
        run: bash scripts/validate-stack.sh alloy

      - name: Validate Loki configuration
        run: bash scripts/validate-stack.sh loki
